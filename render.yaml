databases:
  - name: webgl-rpg-db
    databaseName: webgl_rpg
    user: webgl_rpg
    plan: free

services:
  - type: web
    name: webgl-rpg-multiplayer
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run multiplayer
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: webgl-rpg-db
          property: connectionString