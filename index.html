<!doctype html>
<html lang="pt-BR">
    <head>
        <link rel="stylesheet" href="style.css" />
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>WebGL RPG Multiplayer</title>
    </head>
    <body>
        <main>
            <canvas id="canvas" width="800" height="500"></canvas>
            <nav id="ui-scale-controls" aria-label="Tamanho da interface">
                <button id="ui-scale-decrease" type="button" aria-label="Diminuir interface">-</button>
                <button id="ui-scale-increase" type="button" aria-label="Aumentar interface">+</button>
            </nav>
            <p id="status">Inicializando WebGL...</p>
            <section id="player-status" aria-label="Status do jogador">
                <div class="status-row status-health">
                    <span class="status-label">VIDA</span>
                    <span id="player-hp-value">100/100</span>
                </div>
                <div class="status-bar"><span id="player-hp-bar"></span></div>
                <div class="status-row"><span class="status-label">MANA</span></div>
                <div class="status-bar"><span id="player-mana-bar"></span></div>
                <div class="status-row"><span class="status-label">XP</span></div>
                <div class="status-bar"><span id="player-xp-bar"></span></div>
            </section>
            <aside id="chat" aria-label="Chat do jogo">
                <h2>Chat</h2>
                <ol id="chat-messages" aria-live="polite"></ol>
                <form id="chat-form">
                    <input id="chat-input" maxlength="200" autocomplete="off" placeholder="Digite uma mensagem" />
                    <button type="submit">Enviar</button>
                </form>
            </aside>
        </main>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
